<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Via Lern-Apps</title>
<style>
:root{--bg:#f6f3ec;--ink:#1f1a14;--muted:#6b6257;--card:#fff;--line:#e4dccd;--accent:#8a1c1c}
@media (prefers-color-scheme:dark){:root{--bg:#16130f;--ink:#f3ede2;--muted:#b3a99a;--card:#221d17;--line:#3a3128;--accent:#e0a35a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 16px}
h1{font:700 2rem/1.15 Georgia,serif;margin:0 0 6px}p{color:var(--muted);margin:0 0 24px}
a.app{display:flex;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;text-decoration:none;color:inherit}
a.app img{width:64px;height:64px;border-radius:14px}a.app b{display:block;font-size:1.15rem}a.app span{color:var(--muted);font-size:.92rem}
.tip{font-size:.92rem;border-top:1px solid var(--line);padding-top:16px;margin-top:24px}
</style></head><body><main>
<h1>Via Lern-Apps</h1>
<p>Latein und Italienisch lernen – direkt auf dem Handy.</p>
<a class="app" href="latina/"><img src="latina/icon-180.png" alt=""><div><b>Via Latina</b><span>Latein-Vokabeln, Grammatik, Übersetzen</span></div></a>
<a class="app" href="italiana/"><img src="italiana/icon-180.png" alt=""><div><b>Via Italiana</b><span>Alltagsitalienisch B1–B2</span></div></a>
<p class="tip"><b>Aufs iPhone:</b> App in Safari öffnen → Teilen-Symbol → „Zum Home-Bildschirm“.</p>
</main></body></html>
