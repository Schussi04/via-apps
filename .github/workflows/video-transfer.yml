name: video-transfer
on:
  push:
    branches: [claude/video-transfer]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -o Geburtstagsvideo_V1_Handy_9x16.mp4 https://v3b.fal.media/files/b/0aafce23/nWohdbDVQQqNTSjO2qb1A_Geburtstagsvideo_V1_Handy_9x16.mp4
          ls -la *.mp4
          gh release create transfer-2 --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Transfer 2" --notes "Temporärer Entwurf zur Dateiübertragung" *.mp4
