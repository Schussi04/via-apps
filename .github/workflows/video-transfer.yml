name: video-transfer
on:
  push:
    branches: [claude/video-transfer]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and attach to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          curl -fsSL -o Geburtstagsvideo-Paris_V3_Handy_9x16.mp4 https://v3b.fal.media/files/b/0aafd277/pDyJHxXHZ63LfFAYgZ9vw_Geburtstagsvideo-Paris_V3_Handy_9x16.mp4
          curl -fsSL -o Geburtstagsvideo-Sektglas_V2_Handy_9x16.mp4 https://v3b.fal.media/files/b/0aafd277/SCxR6px-ATh5bxN5sUN88_Geburtstagsvideo-Sektglas_V2_Handy_9x16.mp4
          gh release create transfer-4 --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "Transfer 4" --notes "Temporärer Entwurf zur Dateiübertragung" *.mp4
